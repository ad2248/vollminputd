# 集成测试：容器化构建 + E2E（offline 2 轮 / live 1 轮，原生 HTTP 单后端）。
#
# 运行环境约定：
#   - 专用原生 host runner，注册标签必须是 voiceinput-linux:host（host 执行模式），
#     工作流用 runs-on: voiceinput-linux 调度；
#   - 作业直接跑在宿主机（无 container: 块），podman 由 tests/integration/run.py
#     自行编排；不使用 privileged，不挂 podman socket，不挂 host 设备；
#   - actions/checkout@v4 需要 runner host 上有 Node 20。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # 每天 21:30 UTC（Gitea 定时按 UTC 计算）

jobs:
  integration:
    # 只跑同仓库分支的 PR：作业在原生 host 上执行 PR 代码，对不受信贡献者无法做
    # 安全隔离。此门在 checkout 之前生效——fork PR 整个 job 直接跳过，
    # 既不执行任何代码，也拿不到 secrets（包括 live key）。不用 pull_request_target。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: voiceinput-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration tests
        id: tests
        env:
          # 密钥只经环境变量注入：不落文件、不在 run 脚本里内插 secrets 表达式
          VOLLMINPUTD_DASHSCOPE_API_KEY: ${{ secrets.VOLLMINPUTD_DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$VOLLMINPUTD_DASHSCOPE_API_KEY" ]; then
            echo "===== 未配置 secret VOLLMINPUTD_DASHSCOPE_API_KEY：live DashScope 用例禁用，仅跑离线套件 ====="
            python3 tests/integration/run.py
          else
            echo "===== 已配置 DashScope key：跑离线 + live（原生 HTTP 单后端）====="
            python3 tests/integration/run.py --live
          fi

      # 成败都上传留证：build-out/ 内为每会话日志、源码/包清单与 JUnit 结果，
      # 不含机密（源码快照不含 .env.test）。
       # 用 v3：actions/upload-artifact@v4 与当前 Gitea 不兼容。
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-artifacts
          path: ${{ steps.tests.outputs.artifacts }}

[package]
name = "vollminputd"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
anyhow = "1.0.102"
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1.51.0", features = ["full"] }
serde_json = "1.0"
base64 = "0.22"
cpal = { version = "0.18", features = ["pipewire"] }
async-trait = "0.1"
mockall = "0.13"
notify-rust = "4"

[dev-dependencies]
mockall = "0.13"

[[bin]]
name = "vollminputd"
path = "src/main.rs"

[package]
name = "VoiceInput"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls", "multipart", "json", "stream"] }
tokio = { version = "1.51.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tungstenite = "0.26"
base64 = "0.22"
futures-util = "0.3"
url = "2.5"
cpal = { version = "0.18", features = ["pipewire"] }
async-trait = "0.1"
mockall = "0.13"
notify-rust = "4"

[dev-dependencies]
mockall = "0.13"

[[bin]]
name = "vollminputd"
path = "src/main.rs"
